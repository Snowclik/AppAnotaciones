[package]
name = "appnotas-core"
version = "0.1.0"
edition = "2021"
description = "Core Local-First en Rust con libSQL/Turso y UniFFI para AppNotas"

[lib]
name = "appnotas_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
default = []
bindgen-cli = ["uniffi/cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libsql = "0.10.0"
ring = "0.17"
rust_xlsxwriter = "0.104"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
uniffi = "0.32.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
