<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="AppAnotaciones — Organizador Local-First para Android por Snowclik">
  <defs>
    <clipPath id="hdr-clip">
      <rect x="0.5" y="0.5" width="999" height="269" rx="18"/>
    </clipPath>
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="55%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#0B1221"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="76%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="88%" cy="82%" r="44%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#A78BFA" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hdr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hdr-shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <style>
      @keyframes drift {
        0%, 100% { transform: translateY(0px); opacity: 0.25; }
        50% { transform: translateY(8px); opacity: 0.85; }
      }
      .snow { animation: drift 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .snow { animation: none; opacity: 0.55; }
      }
    </style>
  </defs>

  <g clip-path="url(#hdr-clip)">
    <rect x="0" y="0" width="1000" height="270" fill="url(#hdr-bg)"/>
    <rect x="0" y="0" width="1000" height="270" fill="url(#grid)"/>
    <rect x="0" y="0" width="1000" height="270" fill="url(#glow-cyan)"/>
    <rect x="0" y="0" width="1000" height="270" fill="url(#glow-violet)"/>

    <!-- Partículas atmosféricas -->
    <circle class="snow" cx="562" cy="40" r="1.4" fill="#E0F2FE" style="animation-duration:4.8s;animation-delay:0.0s"/>
    <circle class="snow" cx="624" cy="222" r="1.3" fill="#E0F2FE" style="animation-duration:5.5s;animation-delay:0.8s"/>
    <circle class="snow" cx="690" cy="28" r="1.6" fill="#E0F2FE" style="animation-duration:4.3s;animation-delay:1.2s"/>
    <circle class="snow" cx="932" cy="52" r="1.7" fill="#E0F2FE" style="animation-duration:5.1s;animation-delay:1.7s"/>
    <circle class="snow" cx="958" cy="148" r="1.3" fill="#E0F2FE" style="animation-duration:5.9s;animation-delay:0.4s"/>
    <circle class="snow" cx="910" cy="228" r="1.5" fill="#E0F2FE" style="animation-duration:4.7s;animation-delay:2.1s"/>

    <!-- Ilustración minimalista dark-tech de carpetas + resumen numérico -->
    <g transform="translate(650, 38)">
      <!-- Tarjeta trasera (subcarpeta) -->
      <rect x="26" y="14" width="256" height="176" rx="16" fill="#0B1221" fill-opacity="0.72" stroke="#1E293B" stroke-width="1"/>
      <!-- Tarjeta principal -->
      <rect x="0" y="0" width="268" height="184" rx="16" fill="#070B14" fill-opacity="0.94" stroke="url(#hdr-border)" stroke-width="1"/>

      <!-- Barra superior simulada -->
      <rect x="16" y="16" width="110" height="18" rx="6" fill="#0B1221" stroke="#1E293B" stroke-width="1"/>
      <circle cx="28" cy="25" r="3" fill="#38BDF8"/>
      <text x="37" y="28.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#94A3B8">LOCAL · 0 ms</text>

      <rect x="218" y="16" width="34" height="18" rx="9" fill="#0B1221" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="235" cy="25" r="3.5" fill="#A78BFA"/>

      <!-- Tarjeta resumen hero -->
      <rect x="16" y="44" width="236" height="58" rx="12" fill="url(#card-accent)" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1"/>
      <text x="28" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#BAE6FD">RESUMEN RÁPIDO</text>
      <text x="28" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#F8FAFC">$ 1,450.00</text>
      <rect x="184" y="68" width="56" height="20" rx="8" fill="#060913" fill-opacity="0.7" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1"/>
      <text x="212" y="81.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="600" fill="#DDD6FE">18 reg.</text>

      <!-- Filas agrupadas -->
      <rect x="16" y="112" width="236" height="26" rx="8" fill="#0B1221" stroke="#1E293B" stroke-width="1"/>
      <rect x="24" y="119" width="12" height="12" rx="3" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1"/>
      <rect x="44" y="122" width="96" height="6" rx="3" fill="#CBD5E1" fill-opacity="0.8"/>
      <rect x="196" y="120" width="44" height="10" rx="5" fill="#38BDF8" fill-opacity="0.22"/>

      <rect x="16" y="143" width="236" height="26" rx="8" fill="#0B1221" stroke="#1E293B" stroke-width="1"/>
      <rect x="24" y="150" width="12" height="12" rx="3" fill="#A78BFA" fill-opacity="0.25" stroke="#A78BFA" stroke-width="1"/>
      <rect x="44" y="153" width="76" height="6" rx="3" fill="#94A3B8" fill-opacity="0.7"/>
      <rect x="206" y="151" width="34" height="10" rx="5" fill="#A78BFA" fill-opacity="0.22"/>
    </g>

    <line x1="110" y1="1.5" x2="890" y2="1.5" stroke="url(#hdr-shine)" stroke-width="1"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="269" rx="18" fill="none" stroke="url(#hdr-border)" stroke-width="1"/>

  <text x="46" y="66" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.2" fill="#38BDF8">✦  SNOWCLIK · ANDROID LOCAL-FIRST</text>
  <text x="44" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="3" fill="#F8FAFC">APPANOTACIONES</text>
  <text x="46" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#CBD5E1">Carpetas ilimitadas, totales automáticos y velocidad instantánea</text>

  <rect x="46" y="184" width="490" height="34" rx="10" fill="#0B1221" fill-opacity="0.82" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="62" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#E2E8F0">Rust Core  ·  libSQL / Turso  ·  UniFFI  ·  Material 3 Expressive</text>
</svg>
