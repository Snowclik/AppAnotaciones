<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 125" width="1000" height="125" role="img" aria-label="AppAnotaciones — Pie de página">
  <defs>
    <clipPath id="ftr-clip">
      <rect x="0.5" y="0.5" width="999" height="124" rx="16"/>
    </clipPath>
    <linearGradient id="ftr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#0B1221"/>
    </linearGradient>
    <radialGradient id="ftr-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ftr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.85; }
      }
      .twinkle { animation: twinkle 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .twinkle { animation: none; opacity: 0.45; }
      }
    </style>
  </defs>

  <g clip-path="url(#ftr-clip)">
    <rect x="0" y="0" width="1000" height="125" fill="url(#ftr-bg)"/>
    <rect x="0" y="0" width="1000" height="125" fill="url(#ftr-glow)"/>
    <circle class="twinkle" cx="112" cy="34" r="1.3" fill="#E0F2FE" style="animation-duration:4.4s;animation-delay:0.2s"/>
    <circle class="twinkle" cx="218" cy="86" r="1.5" fill="#E0F2FE" style="animation-duration:5.2s;animation-delay:1.1s"/>
    <circle class="twinkle" cx="326" cy="28" r="1.2" fill="#E0F2FE" style="animation-duration:4.8s;animation-delay:0.6s"/>
    <circle class="twinkle" cx="674" cy="92" r="1.3" fill="#E0F2FE" style="animation-duration:4.6s;animation-delay:0.4s"/>
    <circle class="twinkle" cx="782" cy="30" r="1.6" fill="#E0F2FE" style="animation-duration:5.4s;animation-delay:1.4s"/>
    <circle class="twinkle" cx="892" cy="82" r="1.2" fill="#E0F2FE" style="animation-duration:4.9s;animation-delay:0.8s"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="124" rx="16" fill="none" stroke="url(#ftr-border)" stroke-width="1"/>

  <text x="500" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#F8FAFC">APPANOTACIONES</text>
  <text x="500" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.6" fill="#CBD5E1">Local-First · Rust + libSQL · Material 3 Expressive · por Snowclik</text>
</svg>
